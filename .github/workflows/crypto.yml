name: crypto-watch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min, 24/7 (GitHub may delay a run by a few minutes at busy times)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: { group: alerts, cancel-in-progress: false }

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/halal-portfolio
          token: ${{ secrets.PORTFOLIO_TOKEN }}
          path: private
      - run: |
          [ -f private/transactions.csv ] && cp private/transactions.csv portfolio/transactions.csv || true
          rm -rf private
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pandas requests
      - run: python src/crypto_watch.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git checkout -- portfolio
          git config user.name "halal-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "crypto watch $(date -u +%FT%H%M)"
          git pull --rebase && git push
