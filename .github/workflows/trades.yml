name: trade-log

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min: picks up trades you message to the Telegram bot
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: { group: alerts, cancel-in-progress: false }

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Load your private portfolio repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/halal-portfolio
          token: ${{ secrets.PORTFOLIO_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests
      - name: Log trades sent to the Telegram bot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -d private ] || exit 0
          python src/trade_bot.py private/transactions.csv
          cd private
          git config user.name "halal-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transactions.csv
          git diff --cached --quiet || (git commit -m "trade logged via Telegram" && git push)
      - run: rm -rf private
        if: always()
      - name: Save the Telegram read position
        run: |
          git config user.name "halal-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/telegram_offset.json
          git diff --cached --quiet || git commit -m "telegram offset $(date -u +%FT%H%M)"
          git pull --rebase && git push
